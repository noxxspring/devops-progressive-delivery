apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: frontend
  namespace: online-boutique
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      containers:
      - name: server
        image: ghcr.io/noxxspring/frontend:148577d
        ports:
        - containerPort: 8080
        env:
        - name: REVISION_ID
          value: "v9-real-chaos"
        - name: PORT
          value: "8080"
        - name: PRODUCT_CATALOG_SERVICE_ADDR
          value: "broken-product-catalog:3550"
        - name: CURRENCY_SERVICE_ADDR
          value: "currencyservice:7000"
        - name: CART_SERVICE_ADDR
          value: "cartservice:7070"
        - name: RECOMMENDATION_SERVICE_ADDR
          value: "recommendationservice:8080"
        - name: CHECKOUT_SERVICE_ADDR
          value: "checkoutservice:5050"
        - name: SHIPPING_SERVICE_ADDR
          value: "shippingservice:50051"
        - name: AD_SERVICE_ADDR
          value: "adservice:9555"
        - name: SHOPPING_ASSISTANT_SERVICE_ADDR
          value: "shoppingassistantservice:8080"
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
  strategy:
    canary:
      canaryService: frontend-canary
      stableService: frontend
      trafficRouting:
        istio:
          virtualService:
            name: frontend-virtualservice
            routes:
            - primary
      steps:
      - setWeight: 20
      - pause: { duration: 30s }
      - analysis:
          templates:
          - templateName: success-rate-check
      - setWeight: 50
      - pause: { duration: 30s }
